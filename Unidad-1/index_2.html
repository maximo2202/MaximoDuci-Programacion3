<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>
<body>

    <h1>Registro de Usuario</h1>

    <form action="#" method="POST">
        <div>
            <label for="nombre">Nombre completo:</label><br>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej: pepe argento" tabindex="1">
        </div>

        <br>

        <div>
            <label for="email">Correo electrónico:</label><br>
            <input type="email" id="email" name="email" required placeholder="Ej: pepito@gmail.com" tabindex="2">
        </div>

        <br>

        <div>
            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres" tabindex="3">
        </div>

        <br>

        <div>
            <label>Género:</label><br>
            <input type="radio" id="masculino" name="genero" value="masculino" tabindex="4">
            <label for="masculino">Masculino</label><br>

            <input type="radio" id="femenino" name="genero" value="femenino" tabindex="5">
            <label for="femenino">Femenino</label><br>

            <input type="radio" id="otro" name="genero" value="otro" tabindex="6">
            <label for="otro">Otro</label>
        </div>

        <br>

        <div>
            <label>Intereses:</label><br>
            <input type="checkbox" id="musica" name="intereses" value="musica" tabindex="7">
            <label for="musica">Música</label><br>

            <input type="checkbox" id="deporte" name="intereses" value="deporte" tabindex="8">
            <label for="deporte">Deporte</label><br>

            <input type="checkbox" id="lectura" name="intereses" value="lectura" tabindex="9">
            <label for="lectura">Lectura</label>
        </div>

        <br>

        <div>
            <label for="pais">País:</label><br>
            <select id="pais" name="pais" tabindex="10">
                <option value="argentina">Argentina</option>
                <option value="brasil">Brasil</option>
                <option value="chile">Chile</option>
            </select>
        </div>

        <br>

        <div>
            <label for="comentarios">Comentarios adicionales:</label><br>
            <textarea id="comentarios" name="comentarios" placeholder="Escriba algún comentario opcional aquí..." tabindex="11"></textarea>
        </div>

        <br>

        <div>
            <input type="submit" value="Registrarse" tabindex="12">
        </div>
    </form>

</body>
</html>
